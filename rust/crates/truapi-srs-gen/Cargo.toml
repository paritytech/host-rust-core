[package]
name = "truapi-srs-gen"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Emit per-domain ring-VRF prover parameters for hosts that load them at runtime"
publish = false

[dependencies]
# Built with the parameters compiled in: this is the tool that takes them out.
verifiable = { git = "https://github.com/paritytech/verifiable.git", rev = "19b03deb89b8dea484b143afc8bbe048a74bc1ff", features = ["prover-srs-embedded"] }
sp-crypto-hashing = { version = "0.1", default-features = false }
hex = "0.4"
derive_more = { version = "2", features = ["display", "error", "from"] }

[lints]
workspace = true
