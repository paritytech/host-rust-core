[package]
name = "truapi-pvm-host"
version = "0.1.0"
edition.workspace = true
description = "Reviewed host-rust-core bridge to the standalone PolkaVM application runtime"
license = "MIT"
repository = "https://github.com/paritytech/host-rust-core"
publish = false

[features]
default = []
ffi = ["pvm-runtime/ffi"]
browser-assets = ["dep:pvm-runtime-assets"]
native-gpu = ["pvm-runtime/native-gpu"]

[dependencies]
pvm-runtime = { git = "https://github.com/paritytech/pvm-host-runtime.git", rev = "00a2246e29658d1aa129e55ca0720de6369c6481" }
pvm-runtime-assets = { git = "https://github.com/paritytech/pvm-host-runtime.git", rev = "00a2246e29658d1aa129e55ca0720de6369c6481", optional = true }

[lints]
workspace = true

[[bin]]
name = "pvm-assets-export"
path = "src/bin/pvm-assets-export.rs"
required-features = ["browser-assets"]
