[package]
name = "truapi-platform"
version = "0.1.0"
edition.workspace = true
description = "Platform capability traits for TrUAPI host implementations"
license = "MIT"

[dependencies]
truapi = { path = "../truapi" }
async-trait = { workspace = true }
derive_more = { workspace = true, features = ["debug", "display", "error"] }
futures = { workspace = true }
parity-scale-codec = { workspace = true, features = ["derive"] }
sp-crypto-hashing = { workspace = true, optional = true }
unicode-normalization = { workspace = true }
url = { workspace = true }
uniffi = { workspace = true, optional = true }
zeroize = { workspace = true, features = ["derive"] }

[features]
# In-memory `MockPlatform` for tests and host simulators.
mock = ["dep:sp-crypto-hashing"]
# FFI derives on the review types consumed by native hosts.
uniffi = ["dep:uniffi", "truapi/uniffi"]

[lints]
workspace = true
