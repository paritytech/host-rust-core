[package]
name = "truapi-server"
version = "0.1.0"
edition.workspace = true
description = "TrUAPI server runtime: dispatcher, frames, SCALE, streams"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--one-caller-inline-max-function-size",
    "0",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
    "--enable-sign-ext",
    "--strip-debug",
    "--strip-dwarf",
    "--strip-producers",
]

[package.metadata.wasm-pack.profile.release.wasm-bindgen]
debug-js-glue = false
demangle-name-section = false
dwarf-debug-info = false

[features]
default = ["wasm-signing-host"]
wasm-signing-host = []
# Test-host-only shortcuts a shipping host must not carry, such as answering
# resource allocation as granted without allocating anything.
test-host = []
debug-sink = ["dep:tokio", "dep:tokio-tungstenite", "dep:base64"]
ws-bridge = ["debug-sink", "dep:rand"]

[dependencies]
truapi = { path = "../truapi" }
truapi-platform = { path = "../truapi-platform" }
truapi-macros = { path = "../truapi-macros" }
async-trait = { workspace = true }
derive_more = { workspace = true, features = ["debug", "display", "error", "from"] }
futures = { workspace = true }
futures-timer = { workspace = true }
parity-scale-codec = { workspace = true, features = ["derive"] }
scale-decode = { workspace = true, features = ["derive"] }
# Metadata decoding backs allowance registration, which both the native and the
# wasm host perform, so these are not target-gated.
frame-metadata = { workspace = true, features = ["std", "current", "decode"] }
scale-info = { workspace = true, features = ["decode"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
unicode-normalization = { workspace = true }
url = { workspace = true }
hex = { workspace = true }
nanoid = { workspace = true }
blake2b_simd = { workspace = true }
sp-crypto-hashing = { workspace = true }
schnorrkel = { workspace = true, features = ["alloc", "getrandom"] }
substrate-bip39 = { workspace = true }
zeroize = { workspace = true, features = ["alloc", "derive"] }
getrandom = { workspace = true, features = ["js"] }
hkdf = { workspace = true }
chacha20poly1305 = { workspace = true, features = ["alloc"] }
x25519-dalek = { workspace = true, features = ["static_secrets"] }
sha2 = { workspace = true }
merlin = { workspace = true }
parking_lot = { workspace = true }

tracing = { workspace = true }
# `registry` + `std` only: pulls the Registry + per-layer filter/reload, but
# not `env-filter` (which drags in `regex`, heavy on wasm).
tracing-subscriber = { workspace = true, features = ["registry", "std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The browser core loads `truapi-verifiable` as a separate WASM module instead.
verifiable = { git = "https://github.com/paritytech/verifiable.git", rev = "19b03deb89b8dea484b143afc8bbe048a74bc1ff" }
truapi-verifiable = { path = "../truapi-verifiable" }
truapi = { path = "../truapi", features = ["uniffi"] }
truapi-platform = { path = "../truapi-platform", features = ["uniffi"] }
futures = { workspace = true, features = ["thread-pool"] }
rand = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "macros", "io-util", "time"], optional = true }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["handshake"], optional = true }
uniffi.workspace = true
subxt = { workspace = true, features = ["native"] }
subxt-rpcs = { workspace = true, features = ["jsonrpsee", "native"] }
base64 = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { workspace = true, features = ["wasm-bindgen"] }
js-sys = { workspace = true }
subxt = { workspace = true, features = ["web"] }
subxt-rpcs = { workspace = true, features = ["web"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
console_error_panic_hook = { workspace = true }
send_wrapper = { workspace = true, features = ["futures"] }
web-time = { workspace = true }
web-sys = { workspace = true, features = ["console"] }

[dev-dependencies]
scale-info = { workspace = true, features = ["std"] }
truapi-platform = { path = "../truapi-platform", features = ["mock"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "macros", "io-util", "time"] }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "handshake"] }

[lints]
workspace = true
