name: Deploy Playground

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: bulletin-deploy environment to publish to
        type: choice
        default: paseo-next-v2
        options:
          - paseo-next-v2
          - preview
          - paseo-next
          - paseo-review

concurrency:
  group: deploy-truapi-playground
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          toolchain: stable

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: nightly
          components: rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build @parity/truapi
        run: npm ci && ./scripts/codegen.sh

      - name: Install playground dependencies
        working-directory: playground
        run: yarn install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: playground/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('playground/yarn.lock') }}-${{ hashFiles('playground/src/**', 'playground/scripts/**', 'playground/public/**', 'playground/next.config.js', 'playground/tsconfig.json', 'playground/package.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('playground/yarn.lock') }}-

      - name: Build playground
        working-directory: playground
        run: yarn build

      - name: Upload static export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: truapi-playground-out
          path: playground/out
          if-no-files-found: error

  # The deploy steps live in bulletin-deploy so DotNS changes (per-network TLDs,
  # signer modes, contract addresses after a chain reset) arrive with a version
  # bump instead of a broken deploy.
  deploy-playground:
    needs: build-playground
    permissions:
      contents: read
    uses: paritytech/bulletin-deploy/.github/workflows/deploy.yml@v0.15.0
    with:
      artifact-name: truapi-playground-out
      # Bare label, never a suffixed name: DotNS resolves the TLD per network at
      # deploy time (`paseo` on paseo-next-v2, `dot` on previewnet), so a
      # hardcoded suffix either targets the wrong record or is rejected.
      dotns-domain: truapi-playground
      env: ${{ inputs.environment || 'paseo-next-v2' }}
      # Display only: the gateway host used to build the URL in the run summary.
      gateway: ${{ inputs.environment == 'preview' && 'dot.li' || 'paseo.li' }}
      js-merkle: true
      max-retries: 3
    secrets:
      # Unset in this repo, so bulletin-deploy signs DotNS transactions with its
      # built-in testnet fallback seed. Defining the secret switches the deploy
      # to that owner account with no workflow change.
      mnemonic: ${{ secrets.DOTNS_MNEMONIC }}
