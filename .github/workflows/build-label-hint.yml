name: Build label hint

# The iOS app and the Android APK are built on a pull request only when a label
# asks for them, which is easy to miss. The first time a pull request touches
# either app, this says which label gets a build, once, and never again on that
# pull request. A label already on it is left out, and a pull request that
# already carries every relevant label gets no comment.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "hosts/ios/**"
      - "ios/**"
      - "Package.swift"
      - "Package.resolved"
      - "hosts/android/**"

permissions:
  contents: read

# Queued rather than cancelled, so two pushes in quick succession see each
# other's comment instead of both posting one.
concurrency:
  group: build-label-hint-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  hint:
    name: Say which label builds the app
    # A fork's token cannot comment, and a fork cannot reach the signing and
    # configuration secrets either build needs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const marker = '<!-- build-label-hint -->';
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            if (comments.some(c => c.body && c.body.includes(marker))) {
              core.info('Already hinted on this pull request.');
              return;
            }

            const files = (await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: number, per_page: 100,
            })).flatMap(f => [f.filename, f.previous_filename].filter(Boolean));
            const labels = (await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner, repo, issue_number: number, per_page: 100,
            })).map(l => l.name);

            const builds = [
              {
                label: 'ios-simulator-build',
                path: /^(hosts\/ios\/|ios\/|Package\.swift$|Package\.resolved$)/,
                what: 'builds the iOS app, runs its tests and attaches a simulator build',
              },
              {
                label: 'android-device-build',
                path: /^hosts\/android\//,
                what: 'attaches an APK that installs on a phone or an emulator',
              },
            ].filter(b => files.some(f => b.path.test(f)) && !labels.includes(b.label));

            if (builds.length === 0) {
              core.info('Nothing to hint: no app touched, or its label is already set.');
              return;
            }

            const lines = builds.map(b => `- \`${b.label}\` ${b.what}.`);
            const body = [
              marker,
              'This pull request touches an app, which is not built by default. Add a label to get a build:',
              '',
              ...lines,
              '',
              'Each starts as soon as it is added and follows the branch from then on.',
            ].join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
