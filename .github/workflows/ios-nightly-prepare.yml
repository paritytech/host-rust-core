name: Prepare Nightly

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source ref to create release branch from (existing branch name or commit SHA)"
        type: string
        required: false
        default: main
      increment_step:
        description: "Build number increment step (1 if empty)"
        type: string
        required: false
        default: ""
  schedule:
    # 20:00 UTC, four hours after the app repository builds Safetynet on the
    # same weekday schedule. Far enough apart that one finishes before the
    # other starts, and late enough to carry the day's merges.
    - cron: "0 20 * * 1-5" # 20:00 UTC Monday-Friday

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  prepare:
    uses: ./.github/workflows/ios-prepare-pipeline.yml
    with:
      is_nightly: true
      bump_level: "no-bump"
      source_ref: ${{ inputs.source_ref || 'main' }}
      increment_step: ${{ inputs.increment_step || '' }}
      distribution_workflow: ios-nightly-distribution.yml
