name: Update signing data

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  # Held on workflow_dispatch until the build credentials tracked in #672
  # land. The trigger below is the one this workflow runs on; restoring it
  # is the change that puts this workflow live.
#   schedule:
#     - cron: "0 10 * * *" # 10:00 AM every day

jobs:
  update_signing_data:
    # Held until the iOS cutover. This tree is behind the app repository.
    # It runs match with readonly false over the production and safety
    # identifiers using the read-write Match credential, so it mutates signing
    # state at Apple rather than only reading it. It had no condition at all.
    #
    # Removing this is part of the cutover, tracked on #764.
    if: false
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Setup iOS Environment
        uses: ./hosts/ios/.github/actions/install
        with:
          match_auth_required: "true"
          match_repository_pat: ${{ secrets.FASTLANE_RW_PAT }}

      - name: Update signing data
        working-directory: hosts/ios
        run: bundle exec fastlane update_signing_data
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
