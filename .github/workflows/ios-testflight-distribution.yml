name: Distribute TestFlight Build

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

env:
  IOS_BUNDLE_ID: "io.parity.polkadotapp"
  IOS_EXTENSION_BUNDLE_ID: "io.parity.polkadotapp.NotificationServiceExtension"
  PROVISIONING_PROFILE_SPECIFIER: "match AppStore io.parity.polkadotapp"
  EXTENSION_PROVISIONING_PROFILE_SPECIFIER: "match AppStore io.parity.polkadotapp.NotificationServiceExtension"
  CODE_SIGN_IDENTITY: "Apple Distribution"
  EXPORT_METHOD: "app-store"
  RUN_IN_CI: true
  DELIVER_ALTOOL_ADDITIONAL_UPLOAD_PARAMETERS: "--use-old-altool"
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  distribute_testflight:
    runs-on: macos-26
    # This workflow calls the distribute action directly rather than through
    # ios-build-distribute.yml, so it does not inherit that workflow's
    # github-actions[bot] check. The allowlist is the only thing standing
    # between a hand-started run and a TestFlight build on the production
    # record.
    # This workflow calls the distribute action directly, so it inherits no
    # github-actions[bot] check and this list is the only thing between a
    # dispatch and a TestFlight build on the production record.
    #
    # fromJSON, so this is array membership. Against a plain string `contains`
    # matches a substring, and any actor whose name appears anywhere inside the
    # list, down to a single letter, would pass.
    if: contains(fromJSON('["sergkononenko","ERussel","stepanLav","kogeler","TarikGul","pgherveou","filvecchiato","valentinfernandez1"]'), github.actor)
    name: Distribute TestFlight Build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup iOS Environment
        uses: ./hosts/ios/.github/actions/install
        with:
          match_auth_required: "true"
          match_repository_pat: ${{ secrets.FASTLANE_RO_PAT }}

      - name: Read version and build number
        id: read_marketing_version
        uses: ./hosts/ios/.github/actions/read-build-version
        with:
          ios_bundle_id: ${{ env.IOS_BUNDLE_ID }}
          asc_key_id: ${{ secrets.ASC_KEY_ID }}
          asc_issuer_id: ${{ secrets.ASC_ISSUER_ID }}
          asc_key_base64: ${{ secrets.ASC_KEY_BASE64 }}

      - name: Distribute TestFlight build
        uses: ./hosts/ios/.github/actions/distribute-testflight
        with:
          ios_bundle_id: ${{ env.IOS_BUNDLE_ID }}
          ios_extension_bundle_id: ${{ env.IOS_EXTENSION_BUNDLE_ID }}
          provisioning_profile_specifier: ${{ env.PROVISIONING_PROFILE_SPECIFIER }}
          extension_provisioning_profile_specifier: ${{ env.EXTENSION_PROVISIONING_PROFILE_SPECIFIER }}
          code_sign_identity: ${{ env.CODE_SIGN_IDENTITY }}
          run_in_ci: ${{ env.RUN_IN_CI }}
          build_number: ${{ steps.read_marketing_version.outputs.build_number }}
          asc_key_id: ${{ secrets.ASC_KEY_ID }}
          asc_issuer_id: ${{ secrets.ASC_ISSUER_ID }}
          asc_key_base64: ${{ secrets.ASC_KEY_BASE64 }}
          keychain_password: ${{ secrets.KEYCHAIN_PASSWORD }}
          match_password: ${{ secrets.MATCH_PASSWORD }}
          google_service_info_dev_base64: ${{ secrets.GOOGLE_SERVICE_INFO_DEV_BASE64 }}
          google_service_info_release_base64: ${{ secrets.GOOGLE_SERVICE_INFO_RELEASE_BASE64 }}
          sentry_dsn: ${{ secrets.SENTRY_DSN }}
          meld_basic_auth_token: ${{ secrets.MELD_BASIC_AUTH_TOKEN }}

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: polkadot-app-release-ipa
          path: "hosts/ios/*.ipa"
          retention-days: 7
