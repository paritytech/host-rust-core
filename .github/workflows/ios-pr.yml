name: iOS CI

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  # Only what the iOS app is built from. The app itself, the crates its bindings
  # are generated from, the manifests pinning the toolchain, and this workflow
  # with the action it calls. A change to docs, TypeScript or an unrelated crate
  # cannot affect the app, and three macOS jobs is too much to spend finding
  # that out.
  #
  # The core crates are here because neither binding set is committed, so a
  # UniFFI surface change leaves no hosts/ios diff to key on. That is the same
  # reasoning as the sdk_swift gate in ci.yml, which is the list to keep this in
  # step with.
  pull_request:
    paths:
      - "hosts/ios/**"
      - "ios/**"
      - "Package.swift"
      - "Makefile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "js/container/**"
      # The bootstrap runs npm ci before codegen, and codegen shells out to
      # scripts beyond codegen.sh itself, regen-explorer-versions.mjs and
      # bundle-truapi-dts.mjs, so the whole directory and both npm manifests
      # are inputs to this job.
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "rust/crates/truapi/**"
      - "rust/crates/truapi-codegen/**"
      - "rust/crates/truapi-macros/**"
      - "rust/crates/truapi-platform/**"
      - "rust/crates/truapi-server/**"
      - "rust/crates/truapi-provider/**"
      - "rust/crates/uniffi-bindgen-cli/**"
      - ".github/workflows/ios-pr.yml"
      - ".github/actions/bootstrap-ios-core/**"
  # Kept alongside pull_request so a build can be reproduced on demand without
  # pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  IOS_BUNDLE_ID: "io.parity.polkadotapp.develop"
  IOS_EXTENSION_BUNDLE_ID: "io.parity.polkadotapp.develop.NotificationServiceExtension"
  PROVISIONING_PROFILE_SPECIFIER: "match Development io.parity.polkadotapp.develop"
  EXTENSION_PROVISIONING_PROFILE_SPECIFIER: "match Development io.parity.polkadotapp.develop.NotificationServiceExtension"
  CODE_SIGN_IDENTITY: "Apple Development"
  EXPORT_METHOD: "development"
  BUILD_NUMBER: ${{ github.run_number }}
  RUN_IN_CI: true
  # DEBUG MODE: Set to 'true' to enable enhanced debugging for build failures
  # What it does:
  #   - Enables verbose xcodebuild logging
  #   - Collects and uploads build artifacts (logs, test results)
  #   - Continues build even on failures to gather maximum information
  DEBUG_CI: false

jobs:
  check-skip-label:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check_skip.outputs.skip }}
    steps:
      - name: Check for skip-ci label
        id: check_skip
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = pr ? pr.labels.map(label => label.name) : [];
            const skip = pr ? labels.includes('skip-ci') : false;
            core.setOutput('skip', skip.toString());

  build:
    needs: check-skip-label
    if: needs.check-skip-label.outputs.skip == 'false' && !startsWith(github.head_ref, 'release/')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Setup iOS Environment
        uses: ./hosts/ios/.github/actions/install
        with:
          match_auth_required: "true"
          match_repository_pat: ${{ secrets.FASTLANE_RO_PAT }}

      # The app resolves the core from this tree, and the core's generated
      # bindings are gitignored, so the package graph cannot resolve until
      # they exist.
      - name: Bootstrap the in-tree core
        uses: ./.github/actions/bootstrap-ios-core

      - name: Configure Google services
        uses: ./hosts/ios/.github/actions/configure-google-services
        with:
          google_service_info_base64: ${{ secrets.GOOGLE_SERVICE_INFO_DEV_BASE64 }}
          expected_bundle_id: ${{ env.IOS_BUNDLE_ID }}

      - name: Configure secrets
        uses: ./hosts/ios/.github/actions/configure-secrets
        with:
          sentry_dsn: ${{ secrets.SENTRY_DSN }}
          meld_basic_auth_token: ${{ secrets.MELD_BASIC_AUTH_TOKEN }}

      - name: Build app
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        working-directory: hosts/ios
        run: |
          # Pass debug flag to fastlane if DEBUG_CI is enabled
          if [ "${{ env.DEBUG_CI }}" = "true" ]; then
            echo "🔍 Building app in debug mode..."
            bundle exec fastlane build_app_ci debug:true
          else
            bundle exec fastlane build_app_ci
          fi

      # Warning ratchet: extract warnings from the .xcresult and compare against
      # the committed baseline. Fails the PR on any newly-introduced warning.
      - name: Warning ratchet
        id: ratchet
        continue-on-error: true
        working-directory: hosts/ios
        run: |
          Runscripts/extract_xcresult.sh \
            --out current_warnings.json \
            --baseline build-logs/warnings.json \
            --rdjson warnings.rdjson

      - name: Setup reviewdog
        if: always()
        uses: reviewdog/action-setup@v1

      - name: Annotate new warnings (reviewdog)
        if: always() && hashFiles('warnings.rdjson') != ''
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewdog -f=rdjson -name="warning-ratchet" \
            -reporter=github-pr-review -fail-level=none < warnings.rdjson

      - name: Annotate out-of-diff warnings (reviewdog)
        if: always() && hashFiles('warnings.rdjson') != ''
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewdog -f=rdjson -name="warning-ratchet-out-of-diff" \
            -reporter=github-check -filter-mode=nofilter -fail-level=none < warnings.rdjson

      - name: Fail on new warnings
        if: always() && steps.ratchet.outcome == 'failure'
        run: |
          echo "New build warnings introduced. See the annotations above."
          echo "Fix them, or regenerate & commit build-logs/warnings.json if intentional."
          exit 1

      # Upload build artifacts for debugging - only when DEBUG_CI is enabled
      - name: Upload build artifacts
        if: env.DEBUG_CI == 'true' && (failure() || success())
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts-${{ github.run_number }}
          path: |
            hosts/ios/fastlane/build_logs/
          retention-days: 3

  # An installable build for every commit on the pull request. The simulator
  # slice needs no provisioning profile and no signing identity, so it needs
  # nothing the build job does not already have, and a reviewer can run the
  # change rather than read it.
  #
  # The commit is written into the bundle rather than only into the artifact
  # name, so a build that has been downloaded and unzipped still says what it
  # came from. A build that cannot say is a failure, not something to publish.
  preview:
    name: Simulator preview build
    needs: check-skip-label
    if: needs.check-skip-label.outputs.skip == 'false' && !startsWith(github.head_ref, 'release/')
    runs-on: macos-26-xlarge
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup iOS Environment
        uses: ./hosts/ios/.github/actions/install

      # Simulator slice only here, unlike the build job, which archives for a
      # device through gym and needs both.
      - name: Bootstrap the in-tree core
        uses: ./.github/actions/bootstrap-ios-core
        with:
          sim-only: "true"

      - name: Configure Google services
        uses: ./hosts/ios/.github/actions/configure-google-services
        with:
          google_service_info_base64: ${{ secrets.GOOGLE_SERVICE_INFO_DEV_BASE64 }}
          expected_bundle_id: io.parity.polkadotapp.develop

      - name: Configure secrets
        uses: ./hosts/ios/.github/actions/configure-secrets
        with:
          sentry_dsn: ${{ secrets.SENTRY_DSN }}
          meld_basic_auth_token: ${{ secrets.MELD_BASIC_AUTH_TOKEN }}

      # DevCI to match the build job, so the preview exercises the same chains
      # and configuration the checks do.
      - name: Build the simulator app
        working-directory: hosts/ios
        run: bundle exec fastlane build_app_simulator configuration:'DevCI'

      - name: Stamp the bundle with its commit and package it
        id: package
        working-directory: hosts/ios
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${COMMIT}" ]; then
            echo "::error::No commit to stamp the build with; refusing to publish it"
            exit 1
          fi

          cd build_simulator
          shopt -s nullglob
          apps=(*.app)
          if [ ${#apps[@]} -ne 1 ]; then
            echo "::error::Expected exactly one .app under build_simulator, found ${#apps[@]}"
            exit 1
          fi
          app="${apps[0]}"

          plist="${app}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :TrUAPICommit string ${COMMIT}" "$plist"             || /usr/libexec/PlistBuddy -c "Set :TrUAPICommit ${COMMIT}" "$plist"

          # Read it back. A stamp that did not take is the case this guards.
          stamped="$(/usr/libexec/PlistBuddy -c "Print :TrUAPICommit" "$plist" 2>/dev/null || true)"
          if [ "${stamped}" != "${COMMIT}" ]; then
            echo "::error::Bundle is not stamped with its commit, got '${stamped}'"
            exit 1
          fi
          echo "Stamped ${app} with ${COMMIT}"

          archive="polkadot-app-${COMMIT:0:9}.app.zip"
          zip -qry "${archive}" "${app}"
          echo "archive=hosts/ios/build_simulator/${archive}" >> "$GITHUB_OUTPUT"
          echo "short=${COMMIT:0:9}" >> "$GITHUB_OUTPUT"

      - name: Upload the preview build
        uses: actions/upload-artifact@v7
        with:
          name: simulator-preview-${{ steps.package.outputs.short }}
          path: ${{ steps.package.outputs.archive }}
          retention-days: 14
          if-no-files-found: error

  test:
    needs: check-skip-label
    if: needs.check-skip-label.outputs.skip == 'false' && !startsWith(github.head_ref, 'release/')
    runs-on: macos-26-xlarge
    steps:
      - uses: actions/checkout@v6

      - name: Setup iOS Environment
        uses: ./hosts/ios/.github/actions/install

      # The app resolves the core from this tree, and the core's generated
      # bindings are gitignored, so the package graph cannot resolve until
      # they exist.
      - name: Bootstrap the in-tree core
        uses: ./.github/actions/bootstrap-ios-core

      - name: Configure Google services
        uses: ./hosts/ios/.github/actions/configure-google-services
        with:
          google_service_info_base64: ${{ secrets.GOOGLE_SERVICE_INFO_DEV_BASE64 }}
          expected_bundle_id: ${{ env.IOS_BUNDLE_ID }}

      - name: Configure secrets
        uses: ./hosts/ios/.github/actions/configure-secrets
        with:
          sentry_dsn: ${{ secrets.SENTRY_DSN }}
          meld_basic_auth_token: ${{ secrets.MELD_BASIC_AUTH_TOKEN }}

      - name: Run tests
        working-directory: hosts/ios
        run: |
          # Pass debug flag to fastlane if DEBUG_CI is enabled
          if [ "${{ env.DEBUG_CI }}" = "true" ]; then
            echo "🔍 Running tests in debug mode..."
            bundle exec fastlane run_unit_tests debug:true
          else
            bundle exec fastlane run_unit_tests
          fi

      # Upload test artifacts for debugging - only when DEBUG_CI is enabled
      - name: Upload test artifacts
        if: env.DEBUG_CI == 'true' && (failure() || success())
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-${{ github.run_number }}
          path: |
            hosts/ios/fastlane/test_output/
            hosts/ios/fastlane/build_logs/
          retention-days: 3
