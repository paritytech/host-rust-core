name: CI

on:
  pull_request:
  push:
    branches: [main, release/v0.3.2]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: nightly
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: cargo build
        run: cargo build --workspace --all-targets --all-features

      - name: cargo check wasm32
        run: cargo check --target wasm32-unknown-unknown -p truapi-server

      - name: cargo +nightly clippy wasm32 (truapi-provider browser backends)
        run: cargo +nightly clippy -p truapi-provider --target wasm32-unknown-unknown --no-default-features --features "js smoldot networks" --all-targets -- -D warnings

      # The native-bindings build has no `ws` backend, which makes ChainSource a
      # single-variant enum; --all-features never exercises that shape.
      - name: cargo +nightly clippy (truapi-provider native bindings)
        run: cargo +nightly clippy -p truapi-provider --no-default-features --features uniffi --all-targets -- -D warnings

      - name: cargo +nightly fmt --check
        run: cargo +nightly fmt --check

      - name: cargo +nightly clippy
        run: cargo +nightly clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features

  wasm-provider:
    name: truapi-provider (wasm browser tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: wasm-pack test --headless --chrome
        run: wasm-pack test --headless --chrome rust/crates/truapi-provider --no-default-features --features "js smoldot"

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo deny check licenses
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses

  codegen:
    name: Codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          toolchain: stable

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: nightly
          components: rustfmt

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install workspace deps
        run: npm ci --ignore-scripts

      - name: Run codegen
        run: ./scripts/codegen.sh

      - name: Check generated output is committed
        run: |
          git diff --exit-code -- \
            rust/crates/truapi-server/src/generated \
            rust/crates/truapi-server/src/wasm/generated_bridge.rs \
            rust/crates/truapi-host-cli/js/script-types.d.ts

      - name: Type-check headless host scripts
        run: node_modules/.bin/tsc -p rust/crates/truapi-host-cli/js/tsconfig.json

      - name: Check Rust/TS wire table parity
        run: TRUAPI_REQUIRE_GENERATED_TS=1 cargo test -p truapi-server --test wire_table_ts_parity

      - name: Upload codegen output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codegen-output
          if-no-files-found: error
          retention-days: 1
          path: |
            js/packages/truapi/src/generated
            js/packages/truapi/src/playground/codegen
            js/packages/truapi/src/explorer/codegen
            js/packages/truapi/src/explorer/versions.ts
            js/packages/truapi-host/src/generated
            playground/test/generated
            rust/crates/truapi-host-cli/js/script-types.d.ts

  ios-bindings:
    name: iOS bindings (uniffi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      # Swift bindgen is pure Rust codegen, so this needs neither Xcode nor the
      # iOS targets, unlike rebuild.sh which also builds the xcframework.
      - name: Generate Swift bindings
        run: make uniffi

      - name: Check committed iOS bindings are current
        run: ./ios/truapi-host/scripts/sync-bindings.sh --check

      # The provider ships its own UniFFI surface and its own committed
      # bindings; `rebuild.sh` overwrites them in place, so only this check
      # can fail on drift.
      - name: Check committed TrUAPIProvider bindings are current
        run: make provider-swift-check

  ios-changes:
    name: iOS change filter
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # Actions has no per-job paths filter, so compute it once here and gate
      # ios-swift on the output. On pull_request the checkout is the merge
      # commit, so HEAD^1 is the base. Other events always run the gate.
      #
      # The list needs no broader rust/ entry: the generated bindings are
      # committed under ios/, and ios-bindings runs unconditionally, so a Rust
      # change that moves the UniFFI surface either carries an ios/ change or
      # fails there first.
      - name: Detect iOS-relevant changes
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only HEAD^1 HEAD \
            | grep -qE '^(ios/|Package\.swift$|Makefile$|rust/crates/truapi-server/src/native|rust/crates/truapi-provider/)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  ios-swift:
    name: iOS package (swift compile)
    needs: ios-changes
    if: needs.ios-changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # Resolving the package resolves both binary targets, whichever scheme builds.
      TRUAPI_USE_LOCAL_BINARY: "1"
      TRUAPI_PROVIDER_USE_LOCAL_BINARY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: ios-swift-gate

      # Simulator slice only, debug profile. This gate compiles Swift and ships
      # no binary, so the device slice and release codegen are waste. The
      # published binary is older than the current Rust surface, so
      # TRUAPI_USE_LOCAL_BINARY points the manifest at this build instead.
      - name: Build the simulator XCFramework
        run: make xcframework XCFRAMEWORK_TARGETS=aarch64-apple-ios-sim XCFRAMEWORK_PROFILE=debug

      - name: Stage it into the package
        run: ./ios/truapi-host/scripts/stage-xcframework.sh

      - name: Build the simulator XCFramework for TrUAPIProvider
        run: PROFILE=debug ./ios/truapi-provider/scripts/rebuild.sh --sim-only

      # Compiling the test target is the point: the hand-written conformers a
      # generated-file diff cannot see live there and in TrUAPIHost.swift.
      - name: Compile the package and its tests
        run: |
          xcodebuild build-for-testing \
            -scheme TrUAPIHost \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/TrUAPIHostDerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Compile TrUAPIProvider
        run: swift build --target TrUAPIProvider

  ts-client:
    name: "@parity/truapi"
    runs-on: ubuntu-latest
    needs: codegen
    env:
      TRUAPI_REQUIRE_GENERATED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # Node builtins only, so this needs neither the codegen output nor npm ci.
      - name: Test scripts
        run: npm run test:scripts

      - name: Download codegen output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codegen-output

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build --prefix js/packages/truapi

      - name: Test
        run: npm test --prefix js/packages/truapi

  ts-host:
    name: "@parity/truapi-host"
    runs-on: ubuntu-latest
    needs: codegen
    env:
      TRUAPI_REQUIRE_GENERATED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Download codegen output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codegen-output

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build --prefix js/packages/truapi-host

      - name: Test
        run: npm test --prefix js/packages/truapi-host

  playground:
    name: Playground (build + lint + unit)
    runs-on: ubuntu-latest
    needs: ts-client
    env:
      TRUAPI_REQUIRE_GENERATED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Download codegen output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codegen-output

      - name: Install workspace deps + build @parity/truapi
        run: |
          npm ci --ignore-scripts
          npm run build --prefix js/packages/truapi

      - name: Install playground deps
        working-directory: playground
        run: yarn install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: playground/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('playground/yarn.lock') }}-${{ hashFiles('playground/src/**', 'playground/scripts/**', 'playground/public/**', 'playground/next.config.js', 'playground/tsconfig.json', 'playground/package.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('playground/yarn.lock') }}-

      - name: Build
        working-directory: playground
        run: yarn build

      - name: Lint
        working-directory: playground
        run: yarn lint

      - name: Unit tests
        working-directory: playground
        run: yarn test:unit

  explorer:
    name: Explorer (build + lint)
    runs-on: ubuntu-latest
    needs: ts-client
    env:
      TRUAPI_REQUIRE_GENERATED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download codegen output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codegen-output

      - name: Install workspace deps + build @parity/truapi
        run: |
          npm ci --ignore-scripts
          npm run build --prefix js/packages/truapi

      - name: Install explorer deps
        working-directory: explorer
        run: npm ci

      - name: Lint
        working-directory: explorer
        run: npm run lint

      - name: Build
        working-directory: explorer
        run: npm run build

  e2e:
    name: E2E (playground inside dotli)
    # Temporarily disabled while the dotli playground smoke test is stabilized.
    if: false
    runs-on: ubuntu-latest
    needs: playground
    timeout-minutes: 30
    env:
      TRUAPI_REQUIRE_GENERATED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Download codegen output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codegen-output

      - name: Build @parity/truapi
        run: |
          npm ci --ignore-scripts
          npm run build --prefix js/packages/truapi

      - name: Install dotli deps
        working-directory: hosts/dotli
        run: bun install --frozen-lockfile

      - name: Install playground deps
        working-directory: playground
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: playground
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        working-directory: playground
        run: yarn e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playground/playwright-report
          retention-days: 14

  ci-status:
    name: CI Status
    if: always()
    runs-on: ubuntu-latest
    needs:
      [
        rust,
        wasm-provider,
        licenses,
        codegen,
        ios-bindings,
        ios-changes,
        ios-swift,
        ts-client,
        ts-host,
        playground,
        explorer,
        e2e,
      ]
    steps:
      - name: Check all jobs
        run: |
          results=(
            "${{ needs.rust.result }}"
            "${{ needs.wasm-provider.result }}"
            "${{ needs.licenses.result }}"
            "${{ needs.codegen.result }}"
            "${{ needs.ios-bindings.result }}"
            # ios-changes is listed because a failure there skips ios-swift,
            # and skipped counts as a pass below.
            "${{ needs.ios-changes.result }}"
            "${{ needs.ios-swift.result }}"
            "${{ needs.ts-client.result }}"
            "${{ needs.ts-host.result }}"
            "${{ needs.playground.result }}"
            "${{ needs.explorer.result }}"
            "${{ needs.e2e.result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::One or more CI jobs failed or were cancelled."
              exit 1
            fi
          done
          echo "All CI jobs passed."
