name: CI

on:
  pull_request:
  push:
    branches: [main, release/v0.3.2]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Gates the macOS-only iOS job. Actions is free for public repos, so this is
  # not about billing: the org-wide cap on concurrent macOS jobs is far lower
  # than the Linux cap, so every macOS run we skip is queue time returned to
  # the rest of the org. Everything else runs unconditionally.
  changes:
    name: Detect mobile-affecting changes
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        name: Decide whether the iOS job needs to run
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Fail open: only a pull_request has a base to diff against, and a
          # missing base means we cannot tell. Either way, run the job rather
          # than risk landing an unbuilt change on main.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event is '$EVENT_NAME', not pull_request: running the iOS job."
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "Base commit $BASE_SHA is unavailable: running the iOS job."
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The Swift bindings are generated from truapi-server, so a Rust or
          # manifest change can break the iOS build without touching ios/.
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "Changed files:"
          printf '%s\n' "$changed" | sed 's/^/  /'
          if printf '%s\n' "$changed" | grep -qE '^(ios/|rust/|Cargo\.toml$|Cargo\.lock$|Makefile$|\.github/workflows/ci\.yml$)'; then
            echo "Mobile-affecting paths changed: running the iOS job."
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "No mobile-affecting paths changed: skipping the iOS job."
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cargo build
        run: cargo build --workspace --all-targets --all-features

      - name: cargo check wasm32
        run: cargo check --target wasm32-unknown-unknown -p truapi-server

      - name: cargo +nightly fmt --check
        run: cargo +nightly fmt --check

      - name: cargo +nightly clippy
        run: cargo +nightly clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo deny check licenses
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses

  codegen:
    name: Codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          toolchain: stable

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: nightly
          components: rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install workspace deps
        run: npm ci --ignore-scripts

      - name: Run codegen
        run: ./scripts/codegen.sh

      - name: Check generated Rust output is committed
        run: |
          git diff --exit-code -- \
            rust/crates/truapi-server/src/generated \
            rust/crates/truapi-server/src/wasm/generated_bridge.rs

      - name: Check Rust/TS wire table parity
        run: TRUAPI_REQUIRE_GENERATED_TS=1 cargo test -p truapi-server --test wire_table_ts_parity

      - name: Upload codegen output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codegen-output
          if-no-files-found: error
          retention-days: 1
          path: |
            js/packages/truapi/src/generated
            js/packages/truapi/src/playground/codegen
            js/packages/truapi/src/explorer/codegen
            js/packages/truapi/src/explorer/versions.ts
            js/packages/truapi-host/src/generated
            playground/test/generated

  ts-client:
    name: "@parity/truapi"
    runs-on: ubuntu-latest
    needs: codegen
    env:
      TRUAPI_REQUIRE_GENERATED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Download codegen output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codegen-output

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build --prefix js/packages/truapi

      - name: Test
        run: npm test --prefix js/packages/truapi

  ts-host:
    name: "@parity/truapi-host"
    runs-on: ubuntu-latest
    needs: codegen
    env:
      TRUAPI_REQUIRE_GENERATED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Download codegen output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codegen-output

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build --prefix js/packages/truapi-host

      - name: Test
        run: npm test --prefix js/packages/truapi-host

  playground:
    name: Playground (build + lint)
    runs-on: ubuntu-latest
    needs: ts-client
    env:
      TRUAPI_REQUIRE_GENERATED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download codegen output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codegen-output

      - name: Install workspace deps + build @parity/truapi
        run: |
          npm ci --ignore-scripts
          npm run build --prefix js/packages/truapi

      - name: Install playground deps
        working-directory: playground
        run: yarn install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: playground/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('playground/yarn.lock') }}-${{ hashFiles('playground/src/**', 'playground/scripts/**', 'playground/public/**', 'playground/next.config.js', 'playground/tsconfig.json', 'playground/package.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('playground/yarn.lock') }}-

      - name: Build
        working-directory: playground
        run: yarn build

      - name: Lint
        working-directory: playground
        run: yarn lint

  explorer:
    name: Explorer (build + lint)
    runs-on: ubuntu-latest
    needs: ts-client
    env:
      TRUAPI_REQUIRE_GENERATED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download codegen output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codegen-output

      - name: Install workspace deps + build @parity/truapi
        run: |
          npm ci --ignore-scripts
          npm run build --prefix js/packages/truapi

      - name: Install explorer deps
        working-directory: explorer
        run: npm ci

      - name: Lint
        working-directory: explorer
        run: npm run lint

      - name: Build
        working-directory: explorer
        run: npm run build

  android:
    name: Android host (Kotlin build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      # Also validates gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # Generates the UniFFI Kotlin bindings (gitignored) from the cdylib, then
      # builds and lints the AAR. android-34 and the Java 17 toolchain the module
      # targets are preinstalled on the runner.
      - name: Build + lint the Android host AAR
        run: make android-build

  ios:
    name: iOS host (Swift build)
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Generates the UniFFI Swift bindings and the C header/modulemap the
      # `truapi_serverFFI` system-library target needs (all gitignored), then
      # builds the package. Xcode's Swift toolchain is preinstalled.
      - name: Build the iOS host package
        run: make ios-build

  # hosts/android is a private repo, so checking it out needs a token. The
  # secrets context is not available in a job-level `if`, so the availability of
  # that token is resolved here and consumed as an output. This exists so an
  # absent token reports the parity job as *skipped* rather than passed: `make
  # check-android-parity` succeeds when the submodule is missing, which would
  # otherwise read as verified coverage.
  android-secret:
    name: Probe hosts/android checkout token
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      - id: probe
        env:
          TOKEN: ${{ secrets.ANDROID_CHECKOUT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_CHECKOUT_TOKEN is unavailable (fork PR, or the secret is not configured). The Android shell parity check will be skipped, so drift between the canonical shell and the vendored copy is NOT verified on this run."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  android-parity:
    name: Android shell parity
    runs-on: ubuntu-latest
    needs: android-secret
    if: needs.android-secret.outputs.available == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out hosts/android
        env:
          TOKEN: ${{ secrets.ANDROID_CHECKOUT_TOKEN }}
        run: |
          set -euo pipefail
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          git submodule update --init --depth 1 hosts/android

      - name: Verify the vendored shell matches the canonical one
        run: |
          set -euo pipefail
          # The Makefile skips (and succeeds) when the vendored copy is absent.
          # Having got this far we expect it to exist, so treat absence as a
          # failure instead of inheriting that skip.
          vendored=hosts/android/bindings/truapi-host/src/main/kotlin/io/parity/truapi/TrUAPIHost.kt
          if [ ! -f "$vendored" ]; then
            echo "::error::hosts/android was checked out but $vendored is missing; the parity check cannot run."
            exit 1
          fi
          make check-android-parity

  e2e:
    name: E2E (playground inside dotli)
    # Temporarily disabled while the dotli playground smoke test is stabilized.
    if: false
    runs-on: ubuntu-latest
    needs: playground
    timeout-minutes: 30
    env:
      TRUAPI_REQUIRE_GENERATED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Download codegen output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codegen-output

      - name: Build @parity/truapi
        run: |
          npm ci --ignore-scripts
          npm run build --prefix js/packages/truapi

      - name: Install dotli deps
        working-directory: hosts/dotli
        run: bun install --frozen-lockfile

      - name: Install playground deps
        working-directory: playground
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: playground
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        working-directory: playground
        run: yarn e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playground/playwright-report
          retention-days: 14

  ci-status:
    name: CI Status
    if: always()
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        rust,
        licenses,
        codegen,
        ts-client,
        ts-host,
        playground,
        explorer,
        android,
        ios,
        android-secret,
        android-parity,
        e2e,
      ]
    steps:
      - name: Check all jobs
        run: |
          results=(
            "${{ needs.changes.result }}"
            "${{ needs.rust.result }}"
            "${{ needs.licenses.result }}"
            "${{ needs.codegen.result }}"
            "${{ needs.ts-client.result }}"
            "${{ needs.ts-host.result }}"
            "${{ needs.playground.result }}"
            "${{ needs.explorer.result }}"
            "${{ needs.android.result }}"
            "${{ needs.ios.result }}"
            "${{ needs.android-secret.result }}"
            "${{ needs.android-parity.result }}"
            "${{ needs.e2e.result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::One or more CI jobs failed or were cancelled."
              exit 1
            fi
          done
          echo "All CI jobs passed."
