# Builds and publishes the Android host AAR (io.parity:truapi-host-android) to
# Maven Central. The AAR bundles the per-ABI Rust core (ws-bridge feature), the
# UniFFI Kotlin bindings generated from the same source, and the Kotlin shell.
name: release-android

on:
  # release.yml calls this for a `release: @parity/android-host <version>`
  # commit subject, so the release flow and a manual publish build the AAR
  # exactly the same way.
  workflow_call:
    inputs:
      version:
        description: "Version to publish"
        required: true
        type: string
      ref:
        description: "Commit to build, since a called workflow does not inherit the caller's checkout"
        required: true
        type: string
      publishing_type:
        description: "AUTOMATIC publishes once validated; USER_MANAGED parks the deployment for a person to release or drop"
        required: false
        default: AUTOMATIC
        type: string
    secrets:
      MAVEN_CENTRAL_USERNAME:
        required: true
      MAVEN_CENTRAL_PASSWORD:
        required: true
      MAVEN_CENTRAL_SIGNING_KEY:
        required: true
      # Optional: an unprotected signing key has no passphrase.
      MAVEN_CENTRAL_SIGNING_PASSPHRASE:
        required: false
  # Manual escape hatch, and the rehearsal path: a USER_MANAGED dispatch uploads
  # a real bundle and stops at validation, so the pipeline can be proven without
  # publishing a version Maven Central can never take back. There is
  # deliberately no tag trigger: a tag push cannot use release.yml's
  # workflow_run gate on green CI, so it would be an unverified path to the
  # registry.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0 or 0.1.0-rc.1)"
        required: true
        type: string
      publishing_type:
        description: "Park the deployment for manual release, or publish once validated"
        required: true
        default: USER_MANAGED
        type: choice
        options:
          - USER_MANAGED
          - AUTOMATIC

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      # codegen.sh formats its generated Rust with `cargo +nightly fmt`.
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: nightly
          components: rustfmt
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.8.1

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "8.9"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # truapi-server declares its generated modules unconditionally and they are
      # gitignored, so the crate does not compile until codegen has run.
      - name: Generate the Rust codegen output
        run: |
          npm ci --ignore-scripts
          TRUAPI_SKIP_PACKAGE_BUILD=1 ./scripts/codegen.sh
      - name: Generate UniFFI Kotlin bindings
        run: make uniffi-kotlin

      - name: Cross-compile libtruapi_server.so for every ABI
        run: make android-jni

      - name: Verify AAR inputs
        run: |
          set -e
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f "android/truapi-host/src/main/jniLibs/$abi/libtruapi_server.so" \
              || { echo "missing .so for $abi"; exit 1; }
          done
          test -f android/truapi-host/src/main/kotlin/generated/uniffi/truapi_server/truapi_server.kt

      - name: Build the signed Central bundle
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.MAVEN_CENTRAL_SIGNING_PASSPHRASE }}
          VERSION: ${{ inputs.version }}
        run: gradle :truapi-host:centralBundle -PtruapiHostVersion="${VERSION}"

      # The Portal takes the whole repository layout as one zip and answers with
      # a deployment id. Accepting the file is not publication; the confirm step
      # below is what proves the version landed.
      - name: Upload the bundle to the Central Portal
        id: upload
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          PUBLISHING_TYPE: ${{ inputs.publishing_type }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bundle="android/truapi-host/build/central-bundle/truapi-host-android-${VERSION}-bundle.zip"
          test -f "${bundle}" || { echo "::error::no bundle at ${bundle}"; exit 1; }
          token="$(printf '%s:%s' "${MAVEN_CENTRAL_USERNAME}" "${MAVEN_CENTRAL_PASSWORD}" | base64 -w0)"
          deployment="$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${token}" \
            -F "bundle=@${bundle}" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=truapi-host-android-${VERSION}&publishingType=${PUBLISHING_TYPE}")"
          test -n "${deployment}" || { echo "::error::the Portal accepted the upload but returned no deployment id"; exit 1; }
          echo "deployment=${deployment}" >> "$GITHUB_OUTPUT"
          echo "Uploaded ${bundle} as deployment ${deployment} (${PUBLISHING_TYPE})."

      # A USER_MANAGED deployment stops at VALIDATED and waits for a person, so
      # that is the state to confirm for a rehearsal; a release waits for
      # PUBLISHED. Either way the Portal's own status is the only proof.
      - name: Confirm the deployment
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          DEPLOYMENT: ${{ steps.upload.outputs.deployment }}
          PUBLISHING_TYPE: ${{ inputs.publishing_type }}
        run: |
          set -euo pipefail
          if [ "${PUBLISHING_TYPE}" = "USER_MANAGED" ]; then
            target=VALIDATED
          else
            target=PUBLISHED
          fi
          node scripts/wait-for-central-publish.mjs \
            --deployment "${DEPLOYMENT}" --target "${target}"
