name: Prune superseded caches

# A Rust cache key ends in two hashes, the toolchain environment and Cargo.lock
# with the manifests. When either moves, main saves a new entry beside the old
# one, and GitHub keeps the old one until eviction or its seven-day expiry.
# Until then it counts against the repository's 10 GB, and eviction takes the
# least recently used entries, which can be ones every pull request restores.
#
# The entry rust-cache would fall back to is the newest one sharing everything
# before those two hashes, so any older entry of that family on main is one no
# restore prefers. This deletes them as soon as a main run has saved the new
# set, rather than leaving them to push live entries out.

# workflow_run is safe here: nothing from the triggering run is checked out or
# executed, and the job only lists and deletes cache entries.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["CI", "iOS CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting it"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prune-caches
  cancel-in-progress: false

jobs:
  prune:
    name: Delete superseded Rust caches on main
    # A push to main is what saves a new set. workflow_run's branch filter
    # also matches a pull request whose head branch is called main.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete every entry a newer one of its family supersedes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: |
          set -euo pipefail

          # Only rust-cache's own key shape, so an entry from any other cache
          # action is never mistaken for a member of a family.
          gh api --paginate \
            "repos/${GH_REPO}/actions/caches?ref=refs/heads/main&per_page=100" \
            --jq '.actions_caches[]
              | select(.key | test("^v0-rust-.+-[0-9a-f]{8}-[0-9a-f]{8}$"))
              | [(.key | sub("-[0-9a-f]{8}-[0-9a-f]{8}$"; "")), .created_at, .id, .size_in_bytes, .key]
              | @tsv' \
            | sort -t$'\t' -k1,1 -k2,2r > "${RUNNER_TEMP}/caches.tsv"

          # Sorted by family, newest first, so the first row of each family is
          # the one kept.
          awk -F'\t' 'seen[$1]++' "${RUNNER_TEMP}/caches.tsv" > "${RUNNER_TEMP}/stale.tsv"

          freed=0
          count=0
          {
            echo "### Superseded Rust caches on main"
            echo
            echo "| Key | Size |"
            echo "| --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r _family _created id size key; do
            echo "| \`${key}\` | $((size / 1000000)) MB |" >> "$GITHUB_STEP_SUMMARY"
            if [ "${DRY_RUN}" = "true" ]; then
              echo "would delete ${key}"
            elif gh api --silent -X DELETE "repos/${GH_REPO}/actions/caches/${id}"; then
              echo "deleted ${key}"
            else
              # Evicted or deleted by a concurrent run between the listing and
              # here, which leaves nothing to do.
              echo "::warning::could not delete ${key}"
              continue
            fi
            freed=$((freed + size))
            count=$((count + 1))
          done < "${RUNNER_TEMP}/stale.tsv"

          verb="Deleted"
          [ "${DRY_RUN}" = "true" ] && verb="Would delete"
          echo "${verb} ${count} entries, $((freed / 1000000)) MB."
          { echo; echo "${verb} ${count} entries, $((freed / 1000000)) MB."; } >> "$GITHUB_STEP_SUMMARY"
