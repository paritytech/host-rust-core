name: Release Distribution

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Release branch to build from"
        required: true
        type: string
      release_pr_number:
        description: "Release PR number (empty for direct builds from main)"
        required: false
        type: string
        default: ""
      increment_step:
        description: "Build number increment step for direct builds (1 if empty)"
        required: false
        type: string
        default: ""

jobs:
  build:
    # PR trigger covers hotfix pushes to release branches; nightly PRs (marked in the
    # PR-body metadata) are excluded — a failed nightly is redone via nightly_prepare.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.head_ref, 'release/') &&
       !contains(github.event.pull_request.body, 'nightly_build=true'))
    uses: ./.github/workflows/ios-build-distribute.yml
    with:
      release_branch: ${{ inputs.release_branch || github.head_ref }}
      release_pr_number: ${{ inputs.release_pr_number || github.event.pull_request.number || '' }}
      increment_step: ${{ inputs.increment_step || '' }}
      build_configuration: "Release"
      distribute_to_external_group: false
      external_group_name: ""
    secrets:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      FASTLANE_RO_PAT: ${{ secrets.FASTLANE_RO_PAT }}
      GOOGLE_SERVICE_INFO_DEV_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_DEV_BASE64 }}
      GOOGLE_SERVICE_INFO_RELEASE_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_RELEASE_BASE64 }}
      GOOGLE_SERVICE_INFO_SAFETY_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_SAFETY_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MELD_BASIC_AUTH_TOKEN: ${{ secrets.MELD_BASIC_AUTH_TOKEN }}
      NOTIFICATION_BOT_TOKEN: ${{ secrets.NOTIFICATION_BOT_TOKEN }}
      NOTIFICATION_BOT_URL: ${{ secrets.NOTIFICATION_BOT_URL }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

  send-release-notification:
    name: Send Release Notification
    runs-on: ubuntu-latest
    needs: build
    # Dispatch only. The pull_request trigger rebuilds on every push to a release PR, and
    # those intermediate builds are not a release worth announcing.
    if: >-
      ${{ !cancelled() && github.event_name == 'workflow_dispatch' &&
      needs.build.outputs.succeeded == 'true' }}
    steps:
      - name: Send release notification
        uses: novasamatech/github-actions/send-release-notification@8c20aeac07cb19b3c2ce1310d1ef2947a373ca5e # v5
        with:
          platform: iOS
          pr_list: ${{ needs.build.outputs.pr_list_markdown }}
          release_info: |
            Version: ${{ needs.build.outputs.marketing_version }}
            Build number: ${{ needs.build.outputs.build_number }}
          download_links_format: inline
          # The secret holds a ready-to-render markdown entry, label included, so
          # that an access hint stays out of this public repo. No web page link is
          # configured, so TestFlight is the only entry.
          download_links: |
            ${{ secrets.TESTFLIGHT_DISTRIBUTION_LINK }}
          bot_url: ${{ secrets.NOTIFICATION_BOT_URL }}
          bot_api_token: ${{ secrets.NOTIFICATION_BOT_TOKEN }}
          matrix_room_ids: ${{ secrets.CI_MATRIX_ROOM_IDS }}
