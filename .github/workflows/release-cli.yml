# Builds and publishes prebuilt truapi-host binaries for macOS arm64 and Linux
# (x86_64 and arm64). The Linux legs target musl so one artifact per
# architecture runs on any distro.
#
# Assets land on the existing `@parity/truapi@<version>` release, because the
# CLI crate version tracks the protocol version. A separate rolling release,
# `truapi-host-cli-stable`, carries the `version` asset that the installer and
# the in-binary updater read to answer "what is the latest?" — the repo's npm
# releases dominate `releases/latest`, so that endpoint is unusable here.
name: release-cli

on:
  # release.yml calls this for a `release: @parity/truapi <version>` commit
  # subject, so the release flow and a manual publish build binaries the same way.
  workflow_call:
    inputs:
      version:
        description: "Version to publish"
        required: true
        type: string
      ref:
        description: "Commit to build, since a called workflow does not inherit the caller's checkout"
        required: true
        type: string
  # Manual escape hatch. There is deliberately no tag trigger: a tag push
  # cannot use release.yml's workflow_run gate on green CI, so it would be an
  # unverified path to a published binary.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.10.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The runner bundle is architecture-independent and needs generated sources,
  # so it is built once here rather than three times across the matrix.
  runner:
    name: script runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # codegen.sh formats its generated Rust with `cargo +nightly fmt`, so the
      # nightly toolchain needs rustfmt, exactly as the release job installs it.
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: nightly
          components: rustfmt

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      # The runner imports @parity/truapi from source, so the generated client
      # has to exist before it can be bundled.
      - name: Generate the TypeScript client
        run: |
          npm ci --ignore-scripts
          ./scripts/codegen.sh

      - name: Bundle the runner
        run: make cli-runner

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-runner
          path: target/dist/runner.js
          if-no-files-found: error

  build:
    name: ${{ matrix.target }}
    needs: runner
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: cli-release-${{ matrix.target }}

      # The `cc` crate picks musl-gcc for a musl target; without it ring's C
      # sources link against the host glibc toolchain.
      - name: Install the musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y musl-tools

      # `make cli-dist` treats target/dist/runner.js as a file target, so
      # dropping it here means the archive reuses it instead of rebuilding.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-runner
          path: target/dist

      - name: Verify the crate version matches the release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # awk, not `sed -n '0,/re/'`: that address form is a GNU extension and
          # silently yields nothing on the macOS runner's BSD sed.
          crate="$(awk -F'"' '/^version = /{print $2; exit}' rust/crates/truapi-host-cli/Cargo.toml)"
          if [ "${crate}" != "${VERSION}" ]; then
            echo "::error::truapi-host-cli is ${crate}, but the release declares ${VERSION}. Run npm run version-packages."
            exit 1
          fi

      - name: Build and package
        env:
          VERSION: ${{ inputs.version }}
        run: make cli-dist CLI_TARGET=${{ matrix.target }} CLI_VERSION="${VERSION}"

      # A published binary that cannot start is worse than no binary at all.
      # Every leg builds natively, so each one can run what it just produced.
      - name: Smoke-test the binary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          reported="$(./target/${{ matrix.target }}/release/truapi-host --version)"
          [ "${reported}" = "truapi-host ${VERSION}" ] \
            || { echo "::error::binary reports '${reported}'"; exit 1; }
          tar -tzf "target/dist/truapi-host-${VERSION}-${{ matrix.target }}.tar.gz" \
            | grep -qx runner.js \
            || { echo "::error::archive is missing the product-script runner"; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist

      - name: Attest the binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # The pointer is written only after every archive is live, so it can never
      # advertise a version whose binaries are missing.
      - name: Publish the archives, then move the stable pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          # release.yml normally creates this release first; --target matters
          # only when it did not, so the tag still lands on the release commit
          # rather than wherever the default branch has moved to.
          RELEASE_REF: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          tag="@parity/truapi@${VERSION}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --title "@parity/truapi ${VERSION}" \
              --target "${RELEASE_REF}" \
              --generate-notes
          fi
          gh release upload "${tag}" dist/* --clobber

          printf '%s\n' "${VERSION}" > version
          if ! gh release view truapi-host-cli-stable >/dev/null 2>&1; then
            gh release create truapi-host-cli-stable \
              --title "truapi-host CLI stable pointer" \
              --notes "Names the truapi-host version the installer and the in-binary updater install. Not a release of its own; the binaries live on the matching @parity/truapi release." \
              --latest=false
          fi
          gh release upload truapi-host-cli-stable version --clobber

      # Downloading through the documented URLs is the only proof the
      # percent-encoded tag path resolves and the digests survived upload.
      - name: Verify the published assets are installable
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          base="https://github.com/${REPOSITORY}"
          published="$(curl -fsSL "${base}/releases/download/truapi-host-cli-stable/version" | tr -d '[:space:]')"
          [ "${published}" = "${VERSION}" ] \
            || { echo "::error::pointer says '${published}'"; exit 1; }
          for target in aarch64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            name="truapi-host-${VERSION}-${target}.tar.gz"
            url="${base}/releases/download/%40parity%2Ftruapi%40${VERSION}/${name}"
            curl -fsSL "${url}" -o "${name}"
            curl -fsSL "${url}.sha256" -o "${name}.sha256"
            sha256sum -c "${name}.sha256"
          done
