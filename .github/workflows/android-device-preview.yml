# An installable APK, produced on demand rather than on every commit.
#
# Its own workflow rather than a job in ci.yml, because starting it needs the
# `labeled` event and adding that to ci.yml would rerun every gate each time
# any label changed.
#
# The artifact is attached to the run and nothing else. Unlike the iOS device
# preview there is no provisioning to do: an Android debug build installs on
# any phone that will accept it, so no device has to be registered anywhere.
#
# It builds the flavour that ships. The other flavour replaces Google auth,
# Firebase auth, push and backup with stubs that return failure, so a preview
# built from it cannot sign in and would read as the branch being broken. A
# pull request from a fork cannot reach the configuration this needs, so it is
# told that rather than handed a build that misleads.
name: Android device preview

on:
  pull_request:
    # `labeled` starts it. `synchronize` keeps it current once the label is on,
    # so the APK follows the branch rather than pinning to whichever commit was
    # the head when someone asked.
    types: [labeled, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Installable APK
    # Narrow on purpose. `labeled` fires for every label, so matching only on
    # the label being present lets anything else being added, by a person or by
    # labeler.yml, start a second run for the same commit that cancels the one
    # already building.
    if: >-
      (github.event.action == 'labeled'
       && github.event.label.name == 'android-device-build')
      || (github.event.action == 'synchronize'
          && contains(github.event.pull_request.labels.*.name, 'android-device-build'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Android build
        id: setup
        uses: ./.github/actions/setup-android-build
        with:
          require_inputs: "true"
          google_services_json_base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          keystore_base64: ${{ secrets.CI_GITHUB_KEYSTORE_KEY_FILE }}
          keystore_pass: ${{ secrets.CI_KEYSTORE_PASS }}
          keystore_alias: ${{ secrets.CI_KEYSTORE_KEY_ALIAS }}
          keystore_key_pass: ${{ secrets.CI_KEYSTORE_KEY_PASS }}

      # Configuration rather than credentials. The app tree reads each of these
      # from the environment when local.properties does not carry it, so a
      # preview build needs none of them provisioned. The application id is the
      # exception: it has to match the Google configuration above.
      - name: Build the APK
        working-directory: hosts/android
        env:
          APPLICATION_ID: io.parity.polkadotapp
          APPLICATION_NAME: Polkadot
          CURRENCY_SYMBOL: DOT
          FIRESTORE_DATABASE_ID: preview
          GOOGLE_OAUTH_ID: preview
          # Typed as a long, so a non-numeric placeholder is a compile error.
          GOOGLE_PROJECT_ID: "0"
          LOG_COLLECTION_EMAIL: preview@example.invalid
          NIGHTLY_FUNDING_MNEMONIC: preview
          PRIVACY_POLICY_URL: https://example.invalid/privacy
          SENTRY_ORG: preview
          SENTRY_PROJECT: preview
          TERMS_OF_USE_URL: https://example.invalid/terms
          CI_KEYSTORE_PASS: ${{ secrets.CI_KEYSTORE_PASS }}
          CI_KEYSTORE_KEY_ALIAS: ${{ secrets.CI_KEYSTORE_KEY_ALIAS }}
          CI_KEYSTORE_KEY_PASS: ${{ secrets.CI_KEYSTORE_KEY_PASS }}
        run: ./gradlew assembleGpDebug --no-daemon

      - name: Check exactly one APK came out, and that it is signed
        id: package
        working-directory: hosts/android
        env:
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          apks=("app/build/outputs/apk/gp/debug"/*.apk)
          if [ ${#apks[@]} -ne 1 ]; then
            echo "::error::Expected exactly one APK, found ${#apks[@]}"
            exit 1
          fi

          # A build can produce an unsigned APK without failing, which then
          # installs nowhere. Better to fail here than to hand someone a file
          # that their phone refuses.
          apksigner="$(ls -d "${ANDROID_HOME}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)"
          if [ -z "${apksigner}" ]; then
            echo "::error::No apksigner under ${ANDROID_HOME}/build-tools"
            exit 1
          fi
          "${apksigner}" verify "${apks[0]}"

          short="${COMMIT:0:9}"
          mv "${apks[0]}" "polkadot-app-${short}.apk"
          echo "short=${short}" >> "$GITHUB_OUTPUT"
          echo "apk=hosts/android/polkadot-app-${short}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload the APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-preview-pr-${{ github.event.pull_request.number }}
          path: ${{ steps.package.outputs.apk }}
          overwrite: true
          retention-days: 5
          if-no-files-found: error
