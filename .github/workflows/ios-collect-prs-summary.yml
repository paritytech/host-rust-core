name: PR Summary Report

on:
  workflow_dispatch:
    inputs:
      days:
        description: Number of days to look back for merged PRs
        required: false
        default: 30
        type: number
  # Held on workflow_dispatch until the build credentials tracked in #672
  # land. The trigger below is the one this workflow runs on; restoring it
  # is the change that puts this workflow live.
#   schedule:
#     - cron: "0 7 1 * *" # 1st of every month at 08:00 CET (UTC+1)

jobs:
  pr-summary:
    uses: novasamatech/github-actions/.github/workflows/pr-summary-report.yml@v5
    with:
      days: ${{ fromJSON(github.event.inputs.days || '30') }}
    secrets: inherit
