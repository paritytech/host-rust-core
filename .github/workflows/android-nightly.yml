# A nightly Android build, delivered to Firebase App Distribution.
#
# The iOS nightly goes to TestFlight; App Distribution is this platform's
# equivalent, and it reaches a named tester group rather than anyone with the
# link. That matters here beyond convenience: the build embeds configuration
# that should not be world readable, so a public release asset is not an
# option.
#
# Authentication is federated. The job proves its identity with the run's OIDC
# token and receives a short lived credential, so no long lived key for this
# project is stored anywhere.
name: Android nightly

on:
  # Two hours after the iOS nightly starts, which takes a little over an hour,
  # so the two never overlap and a night's results arrive in one window.
  schedule:
    - cron: "0 22 * * 1-5" # 22:00 UTC Monday to Friday
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  # id-token to mint the OIDC assertion the identity exchange consumes.
  # Nothing is written back to the repository, so contents stays read.
  contents: read
  id-token: write

jobs:
  # Checks what can be checked before an hour of building. It confirms the
  # delivery target is real; it cannot confirm we may write to it, because
  # every read-only call is available to a role that cannot upload.
  preflight:
    name: Check delivery is possible
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: ./.github/actions/check-android-delivery
        with:
          app_id: ${{ secrets.ANDROID_FIREBASE_NIGHTLY_APP_ID }}
          groups: ${{ vars.ANDROID_FIREBASE_GROUP }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

  nightly:
    name: Build and publish
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The app tree pins the nightly its codegen runs under, because rustdoc's
      # JSON format version moves with the toolchain. The value reaches an
      # action input that is interpolated into a shell command, so it is
      # constrained to the dated-nightly shape and to a single line.
      - name: Read the pinned nightly
        id: nightly
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^truapi\.rustNightly=//p' hosts/android/gradle.properties | head -n1)"
          case "${toolchain}" in
            nightly-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *)
              echo "::error::truapi.rustNightly must be a dated nightly, got '${toolchain}'"
              exit 1
              ;;
          esac
          echo "toolchain=${toolchain}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # pinned nightly
        with:
          toolchain: ${{ steps.nightly.outputs.toolchain }}
          components: rustfmt

      # An APK carries the core for every ABI it ships. The convention plugin
      # builds four, and only the truapi-host module narrows to three.
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.8.1
        with:
          shared-key: host-android-bindings-gate
          save-if: false

      # The wrapper jar and its distribution url are both tracked files, and
      # this job signs what it builds.
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Expressions have no arithmetic, so this is computed once here rather
      # than recomputed as `1000 + run_number` at each use.
      - name: Compute the build number
        id: build
        run: echo "id=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Decode the build inputs
        working-directory: hosts/android
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.CI_GITHUB_KEYSTORE_KEY_FILE }}
        run: |
          set -euo pipefail
          umask 077
          for name in GOOGLE_SERVICES_JSON_BASE64 KEYSTORE_BASE64; do
            if [ -z "${!name-}" ]; then
              echo "::error::${name} is not set, so this build cannot be signed or configured"
              exit 1
            fi
          done
          printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" | base64 --decode > app/google-services.json
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > develop_key.jks

      # versionCode comes from the environment; the tree falls back to a
      # constant when it is absent, which would collide across runs.
      - name: Build the nightly APKs
        working-directory: hosts/android
        env:
          CI_BUILD_ID: ${{ steps.build.outputs.id }}
          APPLICATION_ID: ${{ vars.APPLICATION_ID }}
          APPLICATION_NAME: ${{ vars.APPLICATION_NAME }}
          CURRENCY_SYMBOL: ${{ vars.CURRENCY_SYMBOL }}
          LOG_COLLECTION_EMAIL: ${{ vars.LOG_COLLECTION_EMAIL }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          TERMS_OF_USE_URL: ${{ vars.TERMS_OF_USE_URL }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Both fall back to an example.com placeholder rather than failing, so
          # omitting them ships those defaults in an artifact people test with.
          GAME_RESULTS_FALLBACK_URL: ${{ vars.GAME_RESULTS_FALLBACK_URL }}
          REFERRAL_WEB_HOST: ${{ vars.REFERRAL_WEB_HOST }}
          FIRESTORE_DATABASE_ID: ${{ secrets.FIRESTORE_DATABASE_ID }}
          GOOGLE_OAUTH_ID: ${{ secrets.GOOGLE_OAUTH_ID }}
          GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
          NIGHTLY_FUNDING_MNEMONIC: ${{ secrets.NIGHTLY_FUNDING_MNEMONIC }}
          CI_KEYSTORE_PASS: ${{ secrets.CI_KEYSTORE_PASS }}
          CI_KEYSTORE_KEY_ALIAS: ${{ secrets.CI_KEYSTORE_KEY_ALIAS }}
          CI_KEYSTORE_KEY_PASS: ${{ secrets.CI_KEYSTORE_KEY_PASS }}
        # Only the flavour that is distributed. Building the other one costs
        # roughly twenty minutes for an artifact nothing consumes; it can be
        # added back when it has a Firebase application of its own.
        run: ./gradlew assembleGpNightly --no-daemon

      - name: Check the APK is signed by the expected key
        id: package
        working-directory: hosts/android
        env:
          BUILD_ID: ${{ steps.build.outputs.id }}
          EXPECTED_SIGNER: a25eb8df5e015651d6d52849f79b8450b9b36353921600c22e454d4f00372fc6
        run: |
          set -euo pipefail

          # nullglob stays off here: a non-matching glob would otherwise vanish,
          # ls would print the working directory, and the guard would not fire.
          # || true so pipefail does not abort before the message explains it.
          apksigner="$(ls -d "${ANDROID_HOME:-}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "${apksigner}" ]; then
            echo "::error::No apksigner under ${ANDROID_HOME:-<unset>}/build-tools"
            exit 1
          fi

          shopt -s nullglob
          found=("app/build/outputs/apk/gp/nightly"/*.apk)
          shopt -u nullglob
          if [ ${#found[@]} -ne 1 ]; then
            echo "::error::Expected one APK, found ${#found[@]}"
            exit 1
          fi

          # verify alone passes for an APK signed by any key, so a rotated or
          # wrong keystore would ship a build that every tester's device
          # rejects on install. Compare the certificate instead.
          signer="$("${apksigner}" verify --print-certs "${found[0]}" \
            | sed -n 's/.*SHA-256 digest: //p' | head -n1)"
          if [ "${signer}" != "${EXPECTED_SIGNER}" ]; then
            echo "::error::APK is signed by ${signer}, expected ${EXPECTED_SIGNER}"
            exit 1
          fi

          short="${GITHUB_SHA:0:9}"
          mv "${found[0]}" "polkadot-app-gp-${BUILD_ID}-${short}.apk"

          # Signing is done, so neither the key nor the configuration is
          # reachable by anything that runs later in this job.
          rm -f develop_key.jks app/google-services.json

          echo "short=${short}" >> "$GITHUB_OUTPUT"

      # Exchanges the run's OIDC assertion for a short lived credential and
      # writes it where Application Default Credentials will find it. Neither
      # input is sensitive; they are secrets because the project layout is not
      # something a public repository should advertise.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # The CLI rather than a wrapper action, because the credential written
      # above is an external account rather than a service account key, and the
      # CLI resolves it through the standard credential chain instead of
      # parsing the file itself.
      - name: Distribute to testers
        working-directory: hosts/android
        env:
          APP_ID: ${{ secrets.ANDROID_FIREBASE_NIGHTLY_APP_ID }}
          GROUP: ${{ vars.ANDROID_FIREBASE_GROUP }}
          SHORT: ${{ steps.package.outputs.short }}
          BUILD_ID: ${{ steps.build.outputs.id }}
        run: |
          set -euo pipefail

          # A group of only separators is parsed to an empty list, and an upload
          # with no recipients succeeds and reaches nobody, which is worse than
          # failing. Check what survives parsing, not just the empty string.
          if [ -z "${GROUP//[[:space:],]/}" ]; then
            echo "::error::ANDROID_FIREBASE_GROUP names no group, so this build would reach no testers"
            exit 1
          fi

          # Installed under its own prefix. This directory has no package.json,
          # so npm would otherwise walk up and install into the repository root,
          # leaving nothing to run here.
          # --ignore-scripts because this job holds a cloud credential and can
          # mint its own identity assertions, so nothing fetched should run at
          # install time. The CLI is fully functional without them.
          cli="${RUNNER_TEMP}/firebase-cli"
          npm install --prefix "${cli}" --no-save --no-audit --no-fund \
            --ignore-scripts firebase-tools@14.11.1

          # Only the flavour that ships. App Distribution keys a release on the
          # version name and code, which the two flavours share, so uploading
          # both to one app would have the second replace the first and report
          # success. Vanilla needs its own app before it can be distributed.
          "${cli}/node_modules/.bin/firebase" appdistribution:distribute \
            "polkadot-app-gp-${BUILD_ID}-${SHORT}.apk" \
            --app "${APP_ID}" \
            --groups "${GROUP}" \
            --release-notes "Build ${BUILD_ID}, from ${GITHUB_SHA}."
