name: Release Distribution

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Release branch to build from"
        required: true
        type: string
      release_pr_number:
        description: "Release PR number (empty for direct builds from main)"
        required: false
        type: string
        default: ""
      increment_step:
        description: "Build number increment step for direct builds (1 if empty)"
        required: false
        type: string
        default: ""

jobs:
  build:
    # PR trigger covers hotfix pushes to release branches; nightly PRs (marked in the
    # PR-body metadata) are excluded — a failed nightly is redone via nightly_prepare.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.head_ref, 'release/') &&
       !contains(github.event.pull_request.body, 'nightly_build=true'))
    uses: ./.github/workflows/_build_distribute.yml
    with:
      release_branch: ${{ inputs.release_branch || github.head_ref }}
      release_pr_number: ${{ inputs.release_pr_number || github.event.pull_request.number || '' }}
      increment_step: ${{ inputs.increment_step || '' }}
      build_configuration: "Release"
      distribute_to_external_group: false
      external_group_name: ""
      s3_static_subdir: "releases"
    secrets: inherit

  send-release-notification:
    name: Send Release Notification
    runs-on: ubuntu-latest
    needs: build
    # Dispatch only. The pull_request trigger rebuilds on every push to a release PR, and
    # those intermediate builds are not a release worth announcing.
    if: >-
      ${{ !cancelled() && github.event_name == 'workflow_dispatch' &&
      needs.build.outputs.succeeded == 'true' }}
    steps:
      - name: Send release notification
        uses: novasamatech/github-actions/send-release-notification@v5
        with:
          platform: iOS
          pr_list: ${{ needs.build.outputs.pr_list_markdown }}
          release_info: |
            Version: ${{ needs.build.outputs.marketing_version }}
            Build number: ${{ needs.build.outputs.build_number }}
          download_links_format: inline
          # Each secret holds one ready-to-render markdown link entry, e.g.
          # "[TestFlight](https://testflight.apple.com/join/<id>)". The label is part
          # of the secret so that access hints stay out of the public repo.
          download_links: |
            ${{ secrets.TESTFLIGHT_DISTRIBUTION_LINK }}
            ${{ secrets.WEB_PAGE_DISTRIBUTION_LINK }}
          bot_url: ${{ secrets.NOTIFICATION_BOT_URL }}
          bot_api_token: ${{ secrets.NOTIFICATION_BOT_TOKEN }}
          matrix_room_ids: ${{ secrets.CI_MATRIX_ROOM_IDS }}
