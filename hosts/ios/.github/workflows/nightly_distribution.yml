name: Nightly Distribution

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Release branch to build from"
        required: true
        type: string
      release_pr_number:
        description: "Release PR number"
        required: true
        type: string

jobs:
  build_nightly:
    uses: ./.github/workflows/_build_distribute.yml
    with:
      release_branch: ${{ inputs.release_branch }}
      release_pr_number: ${{ inputs.release_pr_number }}
      build_configuration: "Nightly"
      distribute_to_external_group: true
      external_group_name: "Daily test builds"
      s3_static_subdir: "nightly"
    secrets: inherit

  # A nightly run ships the same commit to both apps: the production one (via the Nightly
  # configuration above) and the Safetynet one. Kept as a job here rather than a dispatch of
  # release_distribution.yml so that auto_merge below can wait for both legs — a separate run
  # would race the branch deletion.
  #
  # Safetynet is what Release ships — release feature set — running against the nightly
  # environment, under its own bundle id so it installs alongside the real app. See
  # Configs/base.safetynet.xcconfig.
  build_safetynet:
    uses: ./.github/workflows/_build_distribute.yml
    with:
      release_branch: ${{ inputs.release_branch }}
      release_pr_number: ${{ inputs.release_pr_number }}
      build_configuration: "Safetynet"
      distribute_to_external_group: true
      external_group_name: "Daily test builds"
      s3_static_subdir: "safetynet"
      # Both legs build the same commit against the same test plan, so the Nightly leg
      # owns the single Allure launch.
      run_allure_tests: false
    secrets: inherit

  auto_merge:
    name: Auto-merge nightly build PR
    runs-on: ubuntu-latest
    needs: [build_nightly, build_safetynet]
    if: >-
      ${{ !cancelled() &&
      needs.build_nightly.outputs.succeeded == 'true' &&
      needs.build_safetynet.outputs.succeeded == 'true' }}
    steps:
      - name: Merge PR and delete branch
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = parseInt('${{ inputs.release_pr_number }}', 10);
            console.log(`Auto-merging nightly build PR #${prNumber}...`);
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'merge'
              });
              console.log(`PR #${prNumber} merged successfully`);

              const branch = '${{ inputs.release_branch }}';
              console.log(`Deleting release branch: ${branch}`);
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`
                });
                console.log(`Deleted branch ${branch}`);
              } catch (deleteError) {
                if (deleteError.status === 422) {
                  console.log(`Branch ${branch} already deleted`);
                } else {
                  console.log(`Warning: failed to delete branch ${branch}: ${deleteError.message}`);
                }
              }
            } catch (error) {
              core.warning(`Failed to merge PR #${prNumber}: ${error.message}`);
            }

  send-release-notification:
    name: Send Release Notification
    runs-on: ubuntu-latest
    needs: [build_nightly, build_safetynet]
    if: >-
      ${{ !cancelled() &&
      needs.build_nightly.outputs.succeeded == 'true' &&
      needs.build_safetynet.outputs.succeeded == 'true' }}
    steps:
      - name: Send nightly release notification
        uses: novasamatech/github-actions/send-release-notification@v5
        with:
          platform: iOS
          # Both legs build the same commit, so either PR list is the same set.
          pr_list: ${{ needs.build_nightly.outputs.pr_list_markdown }}
          release_info: |
            Nightly: ${{ needs.build_nightly.outputs.marketing_version }} (${{ needs.build_nightly.outputs.build_number }})
            Safetynet: ${{ needs.build_safetynet.outputs.marketing_version }} (${{ needs.build_safetynet.outputs.build_number }})
          download_links_format: inline
          # Each secret holds one ready-to-render markdown link entry, e.g.
          # "[TestFlight](https://testflight.apple.com/join/<id>)". The label is part
          # of the secret so that access hints stay out of the public repo — with all
          # four rendered together the labels are what distinguishes the two apps.
          download_links: |
            ${{ secrets.TESTFLIGHT_DISTRIBUTION_LINK }}
            ${{ secrets.WEB_PAGE_DISTRIBUTION_LINK }}
            ${{ secrets.TESTFLIGHT_SAFETY_DISTRIBUTION_LINK }}
            ${{ secrets.WEB_PAGE_SAFETY_DISTRIBUTION_LINK }}
          bot_url: ${{ secrets.NOTIFICATION_BOT_URL }}
          bot_api_token: ${{ secrets.NOTIFICATION_BOT_TOKEN }}
          matrix_room_ids: ${{ secrets.CI_MATRIX_ROOM_IDS }}
