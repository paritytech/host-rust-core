name: Nightly Releases

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

env:
  APPLICATION_ID: ${{ vars.APPLICATION_ID }}
  APPLICATION_NAME: ${{ vars.APPLICATION_NAME }}
  CURRENCY_SYMBOL: ${{ vars.CURRENCY_SYMBOL }}
  GAME_RESULTS_FALLBACK_URL: ${{ vars.GAME_RESULTS_FALLBACK_URL }}
  LOG_COLLECTION_EMAIL: ${{ vars.LOG_COLLECTION_EMAIL }}
  PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
  REFERRAL_WEB_HOST: ${{ vars.REFERRAL_WEB_HOST }}
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}
  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
  TERMS_OF_USE_URL: ${{ vars.TERMS_OF_USE_URL }}
  CI_FIREBASE_GROUP: android-daily-tests
  CI_FIREBASE_GROUP_VANILLA: android-daily-tests-vanilla
  CI_FIREBASE_GROUP_SAFETYNET: android-safetynet-testers
  # use it fot tests
  #CI_FIREBASE_GROUP: nightly-ci-test
  # comma-separated chat/room IDs for notifications
  CI_MATRIX_ROOM_IDS: ${{ vars.CI_MATRIX_ROOM_IDS }}

permissions:
  contents: write
  pull-requests: read

jobs:
  nightly-release:
    name: Build, upload to Firebase and create nightly GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate build number
        run: |
          BUILD_NUMBER=$((1000 + ${{ github.run_number }}))
          echo "CI_BUILD_ID=${BUILD_NUMBER}" >> $GITHUB_ENV

      - name: Install dependencies
        uses: ./.github/actions/install/

      - name: Extract app version
        run: |
          echo "Reading version from Versions.kt..."
          python3 .github/scripts/read_versions.py --output-format env > version_output.txt

          # Extract marketing_version from script output
          marketing_version=$(grep 'marketing_version=' version_output.txt | cut -d'=' -f2)

          echo "APP_VERSION_NAME=$marketing_version" >> $GITHUB_ENV
          echo "APP_VERSION_CODE=${CI_BUILD_ID}" >> $GITHUB_ENV

          echo "::notice::App Version: $marketing_version (build $CI_BUILD_ID)"
          echo "Extracted version: $marketing_version"
          echo "Build number: $CI_BUILD_ID"

      - name: Compute nightly release date
        run: echo "RELEASE_DATE=$(date +'%d.%m.%Y')" >> $GITHUB_ENV

      - name: Collect merged PRs — markdown
        id: collect_prs
        uses: novasamatech/github-actions/collect-prs@v5
        with:
          github_token: ${{ github.token }}
          dst_ref: main
          hours: "24"
          release_notes_format: markdown

      - name: Collect merged PRs — plain text
        id: collect_prs_plain
        if: steps.collect_prs.outputs.should_build == 'true'
        uses: novasamatech/github-actions/collect-prs@v5
        with:
          github_token: ${{ github.token }}
          dst_ref: main
          hours: "24"
          release_notes_format: plain

      - name: Prepare Android build files
        if: steps.collect_prs.outputs.should_build == 'true'
        uses: ./.github/actions/prepare-android-build
        with:
          google_services_json_base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          keystore_file_base64: ${{ secrets.CI_GITHUB_KEYSTORE_KEY_FILE }}
          keystore_path: develop_key.jks

      - name: Build nightly APK
        if: steps.collect_prs.outputs.should_build == 'true'
        env:
          CI_KEYSTORE_KEY_ALIAS: ${{ secrets.CI_KEYSTORE_KEY_ALIAS }}
          CI_KEYSTORE_KEY_PASS: ${{ secrets.CI_KEYSTORE_KEY_PASS }}
          CI_KEYSTORE_PASS: ${{ secrets.CI_KEYSTORE_PASS }}
          FIRESTORE_DATABASE_ID: ${{ secrets.FIRESTORE_DATABASE_ID }}
          GOOGLE_OAUTH_ID: ${{ secrets.GOOGLE_OAUTH_ID }}
          GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
          NIGHTLY_FUNDING_MNEMONIC: ${{ secrets.NIGHTLY_FUNDING_MNEMONIC }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./gradlew assembleGpNightly --no-daemon --stacktrace

      - name: Build vanilla nightly APK
        if: steps.collect_prs.outputs.should_build == 'true'
        env:
          CI_KEYSTORE_KEY_ALIAS: ${{ secrets.CI_KEYSTORE_KEY_ALIAS }}
          CI_KEYSTORE_KEY_PASS: ${{ secrets.CI_KEYSTORE_KEY_PASS }}
          CI_KEYSTORE_PASS: ${{ secrets.CI_KEYSTORE_PASS }}
          FIRESTORE_DATABASE_ID: ${{ secrets.FIRESTORE_DATABASE_ID }}
          GOOGLE_OAUTH_ID: ${{ secrets.GOOGLE_OAUTH_ID }}
          GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
          NIGHTLY_FUNDING_MNEMONIC: ${{ secrets.NIGHTLY_FUNDING_MNEMONIC }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./gradlew assembleVanillaNightly --no-daemon --stacktrace

      - name: Build safetynet APK
        if: steps.collect_prs.outputs.should_build == 'true'
        env:
          CI_KEYSTORE_KEY_ALIAS: ${{ secrets.CI_KEYSTORE_KEY_ALIAS }}
          CI_KEYSTORE_KEY_PASS: ${{ secrets.CI_KEYSTORE_KEY_PASS }}
          CI_KEYSTORE_PASS: ${{ secrets.CI_KEYSTORE_PASS }}
          FIRESTORE_DATABASE_ID: ${{ secrets.FIRESTORE_DATABASE_ID }}
          GOOGLE_OAUTH_ID: ${{ secrets.GOOGLE_OAUTH_ID }}
          GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
          NIGHTLY_FUNDING_MNEMONIC: ${{ secrets.NIGHTLY_FUNDING_MNEMONIC }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./gradlew assembleGpSafetynet --no-daemon --stacktrace

      - name: Build debug APK
        if: steps.collect_prs.outputs.should_build == 'true'
        env:
          CI_KEYSTORE_KEY_ALIAS: ${{ secrets.CI_KEYSTORE_KEY_ALIAS }}
          CI_KEYSTORE_KEY_PASS: ${{ secrets.CI_KEYSTORE_KEY_PASS }}
          CI_KEYSTORE_PASS: ${{ secrets.CI_KEYSTORE_PASS }}
          FIRESTORE_DATABASE_ID: ${{ secrets.FIRESTORE_DATABASE_ID }}
          GOOGLE_OAUTH_ID: ${{ secrets.GOOGLE_OAUTH_ID }}
          GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
          NIGHTLY_FUNDING_MNEMONIC: ${{ secrets.NIGHTLY_FUNDING_MNEMONIC }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./gradlew assembleGpDebug --no-daemon --stacktrace

      - name: Build plain text release notes (for Firebase)
        id: meta
        if: steps.collect_prs.outputs.should_build == 'true'
        shell: bash
        env:
          COLLECT_RELEASE_NOTES_PLAIN: ${{ steps.collect_prs_plain.outputs.release_notes }}
        run: |
          HEADER="Nightly ${RELEASE_DATE} (version ${APP_VERSION_NAME} code ${APP_VERSION_CODE})"
          {
            echo "release_notes_plain<<NOTES_PLAIN_EOF"
            echo "$HEADER"
            echo ""
            echo "Merged pull requests:"
            echo "${COLLECT_RELEASE_NOTES_PLAIN}"
            echo "NOTES_PLAIN_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload nightly build to Firebase
        if: steps.collect_prs.outputs.should_build == 'true'
        uses: ./.github/actions/upload-to-firebase
        with:
          appId: ${{ secrets.ANDROID_FIREBASE_NIGHTLY_APP_ID }}
          firebase-token: ${{ secrets.FIREBASE_GOOGLE_SERVICE_ACCOUNT }}
          releaseNotes: ${{ steps.meta.outputs.release_notes_plain }}
          test-groups: ${{ env.CI_FIREBASE_GROUP }}
          upload-file: app/build/outputs/apk/gp/nightly/app-gp-nightly.apk

      - name: Upload vanilla nightly build to Firebase
        if: steps.collect_prs.outputs.should_build == 'true'
        uses: ./.github/actions/upload-to-firebase
        with:
          appId: ${{ secrets.ANDROID_FIREBASE_NIGHTLY_APP_ID }}
          firebase-token: ${{ secrets.FIREBASE_GOOGLE_SERVICE_ACCOUNT }}
          releaseNotes: ${{ steps.meta.outputs.release_notes_plain }}
          test-groups: ${{ env.CI_FIREBASE_GROUP_VANILLA }}
          upload-file: app/build/outputs/apk/vanilla/nightly/app-vanilla-nightly.apk

      - name: Upload safetynet build to Firebase
        if: steps.collect_prs.outputs.should_build == 'true'
        uses: ./.github/actions/upload-to-firebase
        with:
          appId: ${{ secrets.ANDROID_FIREBASE_SAFETYNET_APP_ID }}
          firebase-token: ${{ secrets.FIREBASE_GOOGLE_SERVICE_ACCOUNT }}
          releaseNotes: ${{ steps.meta.outputs.release_notes_plain }}
          test-groups: ${{ env.CI_FIREBASE_GROUP_SAFETYNET }}
          upload-file: app/build/outputs/apk/gp/safetynet/app-gp-safetynet.apk

      - name: Upload to S3
        if: steps.collect_prs.outputs.should_build == 'true'
        uses: novasamatech/github-actions/s3-upload@v5
        with:
          s3_region: fr-par
          s3_access_key: ${{ secrets.SCW_ACCESS_KEY }}
          s3_secret_key: ${{ secrets.SCW_SECRET_KEY }}
          s3_bucket: s3://polkadot-app-artefacts
          source_path: app/build/outputs/apk/gp/nightly/app-gp-nightly.apk
          destination_path: /android/nightly/polkadot-app-${{ env.APP_VERSION_NAME }}-${{ env.APP_VERSION_CODE }}.apk

      - name: Upload to S3 (static path)
        if: steps.collect_prs.outputs.should_build == 'true'
        uses: novasamatech/github-actions/s3-upload@v5
        with:
          s3_region: fr-par
          s3_access_key: ${{ secrets.SCW_ACCESS_KEY }}
          s3_secret_key: ${{ secrets.SCW_SECRET_KEY }}
          s3_bucket: s3://polkadot-app-artefacts
          source_path: app/build/outputs/apk/gp/nightly/app-gp-nightly.apk
          destination_path: /android/nightly/polkadot-app.apk

      - name: Upload vanilla to S3
        if: steps.collect_prs.outputs.should_build == 'true'
        uses: novasamatech/github-actions/s3-upload@v5
        with:
          s3_region: fr-par
          s3_access_key: ${{ secrets.SCW_ACCESS_KEY }}
          s3_secret_key: ${{ secrets.SCW_SECRET_KEY }}
          s3_bucket: s3://polkadot-app-artefacts
          source_path: app/build/outputs/apk/vanilla/nightly/app-vanilla-nightly.apk
          destination_path: /android/nightly/polkadot-app-vanilla-${{ env.APP_VERSION_NAME }}-${{ env.APP_VERSION_CODE }}.apk

      - name: Upload vanilla to S3 (static path)
        if: steps.collect_prs.outputs.should_build == 'true'
        uses: novasamatech/github-actions/s3-upload@v5
        with:
          s3_region: fr-par
          s3_access_key: ${{ secrets.SCW_ACCESS_KEY }}
          s3_secret_key: ${{ secrets.SCW_SECRET_KEY }}
          s3_bucket: s3://polkadot-app-artefacts
          source_path: app/build/outputs/apk/vanilla/nightly/app-vanilla-nightly.apk
          destination_path: /android/nightly/polkadot-app-vanilla.apk

      - name: Trigger Allure TestOps tests
        if: steps.collect_prs.outputs.should_build == 'true'
        uses: novasamatech/github-actions/trigger-allure-testops@v5
        with:
          testplan_id: '733'
          launch_name: 'Android Tests - Nightly ${{ env.RELEASE_DATE }}'
          allure_token: ${{ secrets.ALLURE_TOKEN }}

      - name: Create / update nightly GitHub release
        if: steps.collect_prs.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_LIST: ${{ steps.collect_prs.outputs.release_notes }}
        run: |
          TAG="v${{ env.APP_VERSION_NAME }}-${{ env.APP_VERSION_CODE }}"
          RELEASE_NAME="Nightly ${{ env.RELEASE_DATE }}"
          APK_PATH="app/build/outputs/apk/gp/nightly/app-gp-nightly.apk"
          PREVIEW_APK_PATH="app/build/outputs/apk/gp/debug/app-preview.apk"
          VANILLA_APK_PATH="app/build/outputs/apk/vanilla/nightly/app-vanilla-nightly.apk"
          SAFETYNET_APK_PATH="app/build/outputs/apk/gp/safetynet/app-gp-safetynet.apk"
          mv app/build/outputs/apk/gp/debug/app-gp-debug.apk "$PREVIEW_APK_PATH"
          RELEASE_NOTES="Nightly ${RELEASE_DATE} (version ${APP_VERSION_NAME} code ${APP_VERSION_CODE})

          Merged pull requests:
          ${PR_LIST}"

          # Delete existing release if it exists (for update functionality)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Deleting existing release $TAG..."
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          # Create new nightly release
          echo "Creating release $TAG..."
          gh release create "$TAG" \
            --title "$RELEASE_NAME" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            "$APK_PATH" \
            "$PREVIEW_APK_PATH" \
            "$VANILLA_APK_PATH" \
            "$SAFETYNET_APK_PATH"

      - name: Send release notification
        if: steps.collect_prs.outputs.should_build == 'true'
        uses: novasamatech/github-actions/send-release-notification@v5
        with:
          platform: Android
          pr_list: ${{ steps.collect_prs.outputs.release_notes }}
          release_info: |
            Version: ${{ env.APP_VERSION_NAME }}
            Build number: ${{ env.APP_VERSION_CODE }}
          download_links_format: inline
          download_links: ${{ vars.NIGHTLY_DOWNLOAD_LINKS }}
          bot_url: ${{ secrets.NOTIFICATION_BOT_URL }}
          bot_api_token: ${{ secrets.NOTIFICATION_BOT_TOKEN }}
          matrix_room_ids: ${{ env.CI_MATRIX_ROOM_IDS }}
